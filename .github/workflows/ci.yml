name: Test and build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Select static demo files
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
        run: mv dist/server "$RUNNER_TEMP/courbure-worker"
      - name: Upload static demo
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  demo:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static demo
        id: deployment
        uses: actions/deploy-pages@v4
